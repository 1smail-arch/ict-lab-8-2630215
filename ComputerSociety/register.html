<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Society - Register</title>
</head>
<body>
    <nav>
        <a href="index.html"><img src="images/logo.png" alt="Computer Society logo" width="120"></a> 
        <a href="index.html">Home</a> |
        <a href="events.html">Events</a> |
        <a href="register.html">Register</a> |
        <a href="timetable.html">TimeTable</a> 
    </nav>
    <h1>Register</h1>
    <form action="register.html" method="post">
        <fieldset>
            <legend>Personal Details</legend>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Full Name" autofocus required>
            <br><br>
            <label for="Email">E-mail</label>
            <input type="email" id="Email" name="Email" placeholder="name@example.com" required>
            <br><br>
            <label for="Password">Password</label>
            <input type="password" id="Password" name="Password" minlength="8" required>
            <br><br>
            <label for="phone">Phone no.</label>
            <input type="tel" id="phone" name="phone" placeholder="03001234567" pattern="[0-9]{11}" title="Enter exactly 11 digits">
            <br><br>
            <label for="URL">Website</label>
            <input type="url" id="URL" name="URL" placeholder="https://">
            <br><br>
            <label for="number">Semester</label>
            <input type="number" id="number" name="number" min="1" max="8">
            <br><br>
            <label for="date_of_birth">Date of birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth" required>
            <br><br>
            <label for="favourite_colour">Favourite colour</label>
            <input type="color" id="favourite_colour" name="favourite_colour" value="#1f3a5f">
            <br><br>
            <label for="experience">Experience level</label>
            <input type="range" id="experience" name="experience" min="1" max="10" value="5">
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Preferences</legend>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender" value="male" checked>
            <label for="female">Female</label>
            <input type="radio" id="female" name="gender" value="female">
            <br><br>
            <label for="department">Department</label>
            <br>
            <select name="department" id="department" multiple>
                <option value="CS" selected>Computer Science</option>
                <option value="SE">Software Engineering</option>
                <option value="EE">Electrical Engineering</option>
                <option value="ME">Mechanical Engineering</option>
            </select>
            <br><br>
            <label for="Web">Web</label>
            <input type="checkbox" id="Web" name="interest">
            <label for="AI">AI</label>
            <input type="checkbox" id="AI" name="interest">
            <label for="Networking">Networking</label>
            <input type="checkbox" id="Networking" name="interest">
            <label for="Gaming">Gaming</label>
            <input type="checkbox" id="Gaming" name="interest">
        </fieldset>
        <br><br>
        <label for="profilephoto">Profile Photo</label>
        <input type="file" accept="image/*" id="profilephoto" name="profilephoto">
        <br><br>
        <label for="aboutyou">About you</label>
        <br>
        <textarea name="aboutyou" id="aboutyou" rows="4" cols="40" maxlength="200"></textarea>
        <br><br>
        <button type="submit">Regiater</button>
        <button type="reset">Clear</button>
    </form>
</body>
</html>
